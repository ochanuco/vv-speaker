name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ochanuco/.github/.github/workflows/uv.yml@194995de7425c6457f8d802510787afd02ed9235 # v1.7.0
    with:
      python-version: "3.12"
      run: |
        uv sync --locked
        uv run python -m unittest discover -s tests
